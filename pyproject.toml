[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopipe"
version = "0.1.0"
description = "Task-agnostic automatic preprocessing pipeline selection with meta-learned warm-start"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ricardo Antonio Borbón Mena", email = "ricardobm@estudiantec.cr" }
]
requires-python = ">=3.10"

dependencies = [
    # Image processing
    "opencv-python>=4.9",
    "Pillow>=10.0",
    # Numerical / data
    "numpy>=1.26",
    "pandas>=2.0",       # tabular datasets (TabularDataLoader, tabular transforms)
    # ML models interface
    "scikit-learn>=1.4",
    # Hyperparameter search
    "optuna>=3.6",
    # Parallelism
    "joblib>=1.3",
    # Reporting
    "matplotlib>=3.8",
    "jinja2>=3.1",       # HTML report templates
    "pdfkit>=1.0",       # HTML -> PDF export (backend wkhtmltopdf)
    # Config serialization
    "pyyaml>=6.0",
]
# Nota: la librería no importa torch ni scikit-image. La compatibilidad con
# modelos PyTorch se logra por duck-typing sobre la interfaz fit/predict, de
# modo que quien use un modelo base de PyTorch instala torch por su cuenta.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",          # linter + formatter
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/ItsRichard7/AutoPipe"

# --- Tool configs ---

[tool.setuptools.packages.find]
where = ["."]
include = ["autopipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=autopipe --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle + pyflakes + isort

[tool.mypy]
# La librería declara soporte desde 3.10, pero la verificación de tipos se hace
# contra 3.12: los stubs de numpy instalados usan sintaxis PEP 695, que mypy solo
# acepta con python_version >= 3.12. Con 3.10 fallaba antes de analizar una sola
# línea del proyecto.
python_version = "3.12"
strict = false
ignore_missing_imports = true